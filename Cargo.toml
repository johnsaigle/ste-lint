[package]
name = "ste-lint"
version = "0.2.0"
edition = "2024"
description = "A bounded, STE-inspired prose linter"
license = "MIT"
keywords = ["linter", "prose", "technical-writing", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
